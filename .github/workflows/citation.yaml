# yamllint disable rule:truthy
# yamllint disable rule:line-length
---
name: citation
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-citation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish || github.ref }}

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # --no-project because the script only reads __init__.py as text and
      # never imports pyspeckle, so there is nothing to build here
      - name: Update CITATION.cff and README.rst
        run: |
          uv run --no-project --with requests --with pyyaml \
            python .github/scripts/update_citation.py

      - name: Commit and Push CITATION.cff Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --exit-code || (
            git add CITATION.cff README.rst &&
            git commit -m "Update CITATION.cff with latest release date" &&
            git push origin HEAD:${{ github.event.release.target_commitish || github.ref_name }}
          )
